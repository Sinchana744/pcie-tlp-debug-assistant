
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest anthropic streamlit

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Run sample log analysis
        run: |
          python scripts/gen_logs.py --count 12
          python -m pcie_debug.cli analyze logs/ --workers 2
